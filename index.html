<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0c">
<title>昏檻譚 ― くらきおりのものがたり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   STYLE
   ========================================================= */
:root{
  --bg:#0b0a0c; --panel:#15100d; --panel2:#1c1511; --line:#3b2c21; --line2:#5a4330;
  --text:#d9ceb4; --dim:#8d8170; --faint:#5e5549;
  --crimson:#9b2f2b; --crimson2:#c2463d; --gold:#ab8c4c; --gold2:#d2b16a;
  --hp:#8e2a26; --mp:#3f5a78; --stam:#b07a2e; --exp:#8a7440;
  --font:"Shippori Mincho","Noto Serif JP","Noto Serif CJK JP","Yu Mincho","YuMincho","Hiragino Mincho ProN","BIZ UDPMincho","Sawarabi Mincho",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;overflow:hidden}
body{
  background:
    radial-gradient(ellipse at 50% -10%, rgba(120,40,30,.18), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(60,40,20,.25), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 1px, transparent 1px 4px),
    var(--bg);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  border-left:1px solid #1d1612;border-right:1px solid #1d1612;background:rgba(8,6,6,.55)}
/* top bar */
#topbar{flex:0 0 46px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line);
  background:linear-gradient(#1a130f,#100b09)}
#topbar .ttl{flex:1;font-size:15px;letter-spacing:.3em;color:var(--gold);text-align:center}
.iconbtn{width:44px;height:36px;border:1px solid var(--line2);background:#120d0a;font-size:18px;color:var(--gold)}
.cur{min-width:110px;text-align:right;font-size:13px;color:var(--dim);border:1px solid var(--line);padding:6px 8px;background:#0e0a08}
.cur b{color:var(--gold2);font-weight:600;font-size:15px}
/* main */
#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 10px 12px;-webkit-overflow-scrolling:touch}
#view.noscroll{overflow:hidden;display:flex;flex-direction:column}
/* tab bar */
#tabbar{flex:0 0 58px;display:flex;border-top:1px solid var(--line2);background:linear-gradient(#140e0b,#0a0706);padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--dim);border-right:1px solid #22190f}
#tabbar button:last-child{border-right:none}
#tabbar button .tk{font-size:19px;line-height:1;color:var(--faint)}
#tabbar button.on{color:var(--gold2);background:linear-gradient(#24190f,#140e0a);box-shadow:inset 0 2px 0 var(--crimson)}
#tabbar button.on .tk{color:var(--crimson2)}
.hide{display:none!important}
/* generic */
.panel{border:1px solid var(--line);background:linear-gradient(var(--panel2),var(--panel));padding:8px 10px;margin-bottom:8px;position:relative}
.panel h3{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.15em;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{font-size:11px;color:var(--faint);letter-spacing:0;font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 10px;border:1px solid var(--line2);
  background:linear-gradient(#241a13,#150f0b);color:var(--text);font-size:15px;letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,230,190,.05)}
.btn:active{background:#2e2016;border-color:var(--gold)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.red{border-color:#6e2622;background:linear-gradient(#3a1512,#1d0b09);color:#efd6c4}
.btn.gold{border-color:#7a6232;color:var(--gold2)}
.btn.wide{width:100%}
.row{display:flex;gap:6px}
.row>.btn{flex:1}
.dim{color:var(--dim)} .faint{color:var(--faint)} .gold{color:var(--gold2)} .red{color:var(--crimson2)}
.small{font-size:12px}
p{line-height:1.7}
/* bars */
.bar{position:relative;height:9px;border:1px solid #33271d;background:#0a0706;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp);transition:width .25s}
.bar.mp i{background:var(--mp)} .bar.st i{background:var(--stam)} .bar.ex i{background:var(--exp)}
.barline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.barline .lbl{width:22px;flex:none} .barline .bar{flex:1} .barline .num{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
/* sigil */
.sigil{flex:none;width:46px;height:46px;border:1px solid var(--line2);outline:1px solid #0a0706;outline-offset:-4px;display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--crimson2);background:radial-gradient(circle at 50% 40%,#2a1a13,#0c0807);text-shadow:0 0 6px rgba(160,40,30,.5)}
.sigil img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.sigil.big{width:84px;height:84px;font-size:50px}
.sigil.sm{width:34px;height:34px;font-size:19px}
.fam{display:inline-block;font-size:11px;border:1px solid var(--line2);color:var(--gold);padding:0 4px;margin-left:4px;vertical-align:1px}
/* title */
.title-wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:20px 8px}
.title-logo{text-align:center;font-size:46px;letter-spacing:.35em;color:#e3d6b8;text-shadow:0 0 18px rgba(150,30,20,.55),0 2px 0 #000;margin-right:-.35em}
.title-sub{text-align:center;font-size:12px;letter-spacing:.4em;color:var(--gold);margin:6px 0 22px}
.title-line{height:1px;background:linear-gradient(90deg,transparent,var(--crimson),transparent);margin:14px 0}
.premise p{font-size:14px;color:#c8bca2;margin-bottom:10px;text-indent:1em}
.title-btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.title-btns .btn{min-height:52px;font-size:18px;letter-spacing:.4em}
.copy{margin-top:20px;text-align:center;font-size:11px;color:var(--faint)}
/* home */
.online{display:flex;flex-direction:column;gap:2px;font-size:12px}
.online div{display:flex;justify-content:space-between;color:var(--dim)} .online b{color:var(--text);font-weight:400}
.status .who{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.status .who .nm{font-size:16px} .status .who .lv{color:var(--gold2);font-size:14px}
.timer{font-size:11px;color:var(--faint);text-align:right;margin-top:1px;font-variant-numeric:tabular-nums}
.minip{display:flex;gap:6px;margin-top:6px;align-items:center}
.minip .mp1{flex:1;min-width:0;display:flex;gap:5px;align-items:center;border:1px solid #2a1f17;padding:3px;background:#0f0b09}
.minip .mp1 .t{min-width:0;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fac{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.fac .btn{flex-direction:column;font-size:12px;min-height:58px;padding:4px 2px;letter-spacing:0;gap:2px}
.fac .btn .k{font-size:18px;color:var(--gold)}
.fac .btn .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;background:var(--crimson2);border-radius:0}
.fac .btn{position:relative}
.rank{font-size:12px}
.rank div{display:flex;gap:6px;padding:2px 0;border-bottom:1px dotted #2b2119;color:var(--dim)}
.rank div span:first-child{width:24px;color:var(--gold)} .rank div span:nth-child(2){flex:1} .rank div.me{color:var(--text)} .rank div.me span:nth-child(2){color:var(--crimson2)}
.gates{display:flex;flex-direction:column;gap:5px}
.gate{display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:48px;width:100%}
.gate .gn{font-size:15px} .gate .gi{font-size:11px;color:var(--dim)}
.gate.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--crimson2);background:linear-gradient(#2d2016,#180f0b)}
.explore-big{width:100%;min-height:64px;font-size:22px;letter-spacing:.5em;margin:4px 0 8px;border:1px solid #8a3a2e;
  background:linear-gradient(#4a1914,#220a08);color:#f0dcc6;text-shadow:0 0 8px rgba(200,60,40,.6);box-shadow:inset 0 0 0 3px #1a0806,inset 0 0 0 4px #5c2a20}
.explore-big small{display:block;font-size:11px;letter-spacing:.1em;color:#c9a88a}
/* cards */
.mlist{display:flex;flex-direction:column;gap:5px}
.mcard{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#100c0a;padding:5px;text-align:left;width:100%;min-height:58px}
.mcard .mi{flex:1;min-width:0}
.mcard .mn{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .ms{font-size:11px;color:var(--dim)}
.mcard.sel{border-color:var(--gold);background:#22170f}
.mcard.dead .sigil{filter:grayscale(1) brightness(.5)}
.mcard.dead .mn{color:var(--faint);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 12px;font-size:13px;margin:6px 0}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted #2b2119}
.skl{font-size:13px;border:1px solid #2a1f17;padding:4px 6px;margin-top:3px;background:#0e0a08}
.skl b{font-weight:600;color:var(--gold2)} .skl span{color:var(--dim);font-size:11px}
.flavor{font-size:13px;color:#b5a88e;line-height:1.75;border-left:2px solid var(--crimson);padding-left:8px;margin:6px 0}
/* explore / battle */
.dhead{border:1px solid var(--line2);padding:6px 8px;background:linear-gradient(#22170f,#120c09);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dhead .an{font-size:16px;color:var(--gold2);letter-spacing:.1em} .dhead .fl{font-size:12px;color:var(--dim)}
.logbox{flex:1 1 auto;min-height:120px;overflow-y:auto;border:1px solid var(--line);background:#080605;padding:6px 8px;font-size:14px;line-height:1.65;margin-bottom:6px}
.logbox div{color:#7c7263;padding:1px 0}
.logbox div.hl{color:var(--gold2)} .logbox div.bad{color:#b0655a} .logbox div.good{color:#9fae84}
.logbox div.new{color:#f0e4c8;border-left:2px solid var(--crimson2);padding-left:6px;margin-left:-8px}
.logbox div.sep{color:var(--faint);text-align:center;font-size:11px;letter-spacing:.3em}
.prow{display:flex;gap:4px;margin-bottom:6px}
.pu{flex:1;min-width:0;border:1px solid var(--line);background:#100c0a;padding:4px}
.pu .top{display:flex;gap:4px;align-items:center;margin-bottom:3px}
.pu .nm{font-size:12px;line-height:1.25;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pu .nm small{display:block;color:var(--dim);font-size:10px}
.pu .bar{height:7px;margin-top:2px}
.pu .hpn{font-size:10px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.pu.dead{opacity:.4} .pu.hit{animation:hit .3s}
.pu.enemy{border-color:#4a2420;background:#140908}
@keyframes hit{0%{background:#5a1a14}100%{background:#100c0a}}
.dbtns{display:flex;gap:6px;flex:none}
.dbtns .btn{flex:1}
.go{min-height:56px;font-size:19px;letter-spacing:.3em}
.result{border:1px solid var(--gold);background:#1a120c;padding:8px;margin-bottom:6px;font-size:14px;flex:none}
.result .q{margin-bottom:6px;line-height:1.6}
/* modal */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
#modal .mbox{width:100%;max-height:88%;overflow-y:auto;border:1px solid var(--line2);outline:1px solid #000;background:linear-gradient(#1f1611,#110c09);padding:12px;box-shadow:0 0 30px #000}
#modal .mbox h4{font-size:15px;color:var(--gold2);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:8px;letter-spacing:.12em}
#modal .mbtns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.soon{text-align:center;padding:40px 12px}
.soon .k{font-size:60px;color:var(--crimson);opacity:.7}
.soon h2{font-size:18px;color:var(--gold2);letter-spacing:.3em;margin:10px 0}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:#1d130e;border:1px solid var(--gold);padding:8px 14px;font-size:13px;z-index:20;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.fslot{display:flex;gap:6px;margin-bottom:6px}
.fslot>div{flex:1;border:1px dashed var(--line2);min-height:66px;padding:5px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.fslot>div.on{border-style:solid;border-color:var(--gold)}
.fplus{flex:none!important;border:none!important;min-height:0!important;font-size:20px!important;color:var(--crimson2);width:18px}
.shop .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted #2b2119}
.shop .it .d{flex:1;font-size:13px} .shop .it .d small{display:block;color:var(--dim);font-size:11px}
.shop .it .btn{min-width:96px}
/* archive / reader */
.arch-tabs{display:flex;gap:4px}
.arch-tabs button{flex:1;min-height:48px;border:1px solid var(--line);background:#0f0b09;color:var(--dim);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;letter-spacing:.1em}
.arch-tabs button small{font-size:11px;color:var(--faint);letter-spacing:0}
.arch-tabs button.on{border-color:var(--gold);color:var(--gold2);background:linear-gradient(#2a1d13,#150f0b);box-shadow:inset 0 -2px 0 var(--crimson2)}
.arch-tabs .dot,.lr .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;background:var(--crimson2)}
.zk-fam{border:1px solid var(--line);background:linear-gradient(var(--panel2),var(--panel));padding:6px 8px;margin-bottom:6px}
.zk-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:4px;color:var(--gold);font-size:14px}
.zk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.zk{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border:1px solid #2a1f17;background:#0e0a08;font-size:12px;min-height:72px;text-align:center}
.zk span{line-height:1.3}
.zk.own{border-color:var(--line2)}
.zk i{position:absolute;top:2px;right:3px;font-style:normal;font-size:10px;color:var(--gold2);border:1px solid #6a5230;padding:0 2px}
.zk.none{color:var(--faint)} .zk.none .sigil{color:var(--faint);text-shadow:none}
.lore-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.lr{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:52px;padding:6px 10px;border:1px solid var(--line);background:linear-gradient(#1a130f,#100b09)}
.lr .no{flex:none;width:72px;white-space:nowrap;font-size:12px;color:var(--gold);letter-spacing:.05em}
.lr .tt{flex:1;min-width:0;font-size:15px;line-height:1.45}
.lr .tt small{display:block;font-size:11px;color:var(--dim)}
.lr .new{display:inline-block;font-weight:400;font-size:11px;color:#f0dcc6;background:var(--crimson);padding:0 4px;margin-right:6px;vertical-align:2px}
.lr.lock{opacity:.55;background:#0c0908} .lr.lock .tt{color:var(--faint)}
.addendum{margin-top:8px;border:1px solid #5a4330;background:#150e0a;padding:8px 10px;font-size:13.5px;line-height:1.85;color:#e0cfa8}
.addendum .ah{font-size:11px;color:var(--crimson2);letter-spacing:.3em;margin-bottom:2px}
.reader{padding:18px 8px 10px}
.rd-kick{font-size:12px;color:var(--crimson2);letter-spacing:.35em;text-align:center}
.rd-title{font-size:24px;font-weight:600;color:#e8dcc0;text-align:center;letter-spacing:.2em;margin:8px 0 4px;text-shadow:0 0 12px rgba(150,30,20,.45)}
.rd-orn{text-align:center;color:var(--crimson);font-size:10px;margin:6px 0 16px;letter-spacing:1em}
.rd-auth{text-align:right;font-size:13px;color:var(--dim);margin:6px 0 16px}
.rd-body p{font-size:16px;line-height:2.05;color:#d4c8ad;text-indent:1em;margin-bottom:1.1em}
.rd-body p.verse{white-space:pre-line;text-indent:0;padding-left:1em;border-left:1px solid var(--line2);color:#dccfb0}
.rd-body p.note{font-size:13.5px;color:var(--dim);text-indent:0;border-top:1px dotted var(--line2);padding-top:.6em}
.reader.lore .rd-body{border:1px solid var(--line);background:linear-gradient(#17110d,#0f0a08);padding:14px 14px 4px}
.rd-foot{position:sticky;bottom:-12px;padding:10px 0 12px;background:linear-gradient(rgba(11,10,12,0),#0b0a0c 30%)}
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="hide">
    <button class="iconbtn" data-act="tab" data-tab="menu" aria-label="メニュー">≡</button>
    <div class="ttl">昏檻譚</div>
    <div class="cur">骨貨 <b id="gold">0</b></div>
  </header>
  <main id="view"></main>
  <nav id="tabbar" class="hide">
    <button data-act="tab" data-tab="home"><span class="tk">塞</span>拠点</button>
    <button data-act="tab" data-tab="party"><span class="tk">鎖</span>支度</button>
    <button data-act="tab" data-tab="guild"><span class="tk">盟</span>結社</button>
    <button data-act="tab" data-tab="market"><span class="tk">秤</span>闇市</button>
    <button data-act="tab" data-tab="menu"><span class="tk">帖</span>覚書</button>
  </nav>
  <div id="modal" class="hide"></div>
</div>
<script>
/* =========================================================
   DATA ── ゲームデータ（ここを編集・追加して拡張する）
   monsters[].img に画像パスを入れると、紋字の代わりに画像が表示される。
   ========================================================= */
const DATA = {
  title: '昏檻譚',
  currency: '骨貨',
  stamina: '燈',
  premise: [
    '七十年前、陽は喪われた。灰鐘の国には灰の雨が降り続け、死者は土に還らず、獣は闇に歪んだ。',
    '人々は魔を鎖で縛り、その牙を借りて夜を凌ぐ。そうした者を《檻守（おりもり）》と呼ぶ。',
    'あなたは最後の檻守のひとり。錆びた鎖と二匹の獣を連れ、陽を殺した者たちの墓所へ降りてゆく。'
  ],
  families: {
    '骸': '朽ちてなお動く死者の系統。守りが堅い。',
    '獣': '闇に歪んだ獣の系統。牙が鋭く、素早い。',
    '霊': '弔われぬ魂の系統。癒しと吸精に長ける。',
    '蟲': '死を苗床に育つ蟲の系統。毒を操る。',
    '呪': '人の悪意が形を得た系統。呪詛で敵を弱らせる。'
  },
  /* type: dmg(物理) / magic(守備無視) / drain(吸収) / heal / debuff / buff / poison
     tgt : one(敵単体) / all(敵全体) / ally(味方単体) / allyAll(味方全体) / self */
  skills: {
    bite:    {name:'噛み裂き',   mp:2, type:'dmg',   pow:1.5, tgt:'one',  desc:'敵単体に強く噛みつく', msg:'{a}は{t}の喉笛に喰らいついた！'},
    ash:     {name:'灰の吐息',   mp:4, type:'dmg',   pow:0.75,tgt:'all',  desc:'敵全体に灰を吐きかける', msg:'{a}は灰色の吐息を撒き散らした！'},

DATA.story = [
  {id:'c0', no:'序章', title:'灰の雨', body:[
    '七十年前のある正午、陽は空から剥がれ落ちた。人々が見上げた先には、太陽の形をした黒い穴だけが残り、その日から灰の雨が降り始めた。',
    '死者は土に還らなくなった。弔いの鐘を撞いても、祈りを捧げても、骸は夜ごと起き上がり、獣は死肉を喰らって歪んでいった。',
    '王都は、狂える逆月教団が陽を殺したのだと布告した。そして檻守組合が生まれた。陽の祝福を宿すという鎖で魔を縛り、その牙で人を守る者たち。',
    'あなたは目を覚ます。組合の地下、冷たい石の寝台の上で。手には錆びた鎖が巻かれ、その先に二匹の魔が繋がれている。自分の名を思い出そうとして、思い出せないことに気づく。',

  {id:'c1b', no:'第一章・終', title:'送れぬ鐘', body:[
    '鐘撞き骸は、崩れ落ちる最後の瞬間まで縄を離さなかった。骨だけの指が縄に絡みつき、あなたが近づくと、顎がかすかに動いた。',

  {id:'c2a', no:'第二章', title:'膿沼の廃村', body:[

function load(){
  try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (!s || !s.mons) return false; S = s;
    S.items = Object.assign({kusuri:0, touyu:0}, S.items||{}); S.seen = S.seen||{}; S.story = S.story||{}; S.lore = S.lore||{};
    if (!S.owned){ S.owned = {}; S.mons.forEach(m=>{ S.owned[m.id]=true; }); } return true; }catch(e){ return false; }
}

/* ---------- monsters ---------- */
const MD = m => DATA.monsters[m.id];
function calc(m){
  const d = MD(m), o = {};
  for (const k in d.base) o[k] = Math.floor(d.base[k] + d.grow[k]*(m.lv-1)) + ((m.plus&&m.plus[k])||0);
  return o;
}
function newMon(id, lv){
  const d = DATA.monsters[id];
  const m = {uid: ++S.uidSeq, id, lv, exp:0, hp:0, mp:0, skills:d.skills.slice(), plus:{hp:0,mp:0,atk:0,def:0,spd:0}};
  const c = calc(m); m.hp = c.hp; m.mp = c.mp; return m;
}
const need = lv => Math.floor(8*Math.pow(lv,1.5) + 4);
const getMon = uid => S.mons.find(m => m.uid === uid);
const partyMons = () => S.party.map(getMon).filter(Boolean);
const boxMons = () => S.mons.filter(m => !S.party.includes(m.uid));
function power(){ return partyMons().reduce((t,m)=>{ const c=calc(m); return t + c.atk + c.def + c.spd + Math.floor(c.hp/2) + m.lv*5; }, 0); }
function gainExp(m, x, lines){
  const d = MD(m); m.exp += x;
  const lv0 = m.lv, before = calc(m);
  while (m.lv < 99 && m.exp >= need(m.lv)){ m.exp -= need(m.lv); m.lv++; }
  if (m.lv > lv0){
    const after = calc(m);
    const up = Object.keys(after).map(k => after[k]-before[k] > 0 ? STAT_JP[k]+'+'+(after[k]-before[k]) : '').filter(Boolean).join(' ');
    m.hp = Math.min(after.hp, m.hp + (after.hp-before.hp)); m.mp = Math.min(after.mp, m.mp + (after.mp-before.mp));
    lines.push({t:`${d.name}は Lv${m.lv} になった！（${up}）`, c:'hl'});
  }
}
function sigil(d, cls){ return `<div class="sigil ${cls||''}">${d.img ? `<img src="${d.img}" alt="${d.name}">` : d.sigil}</div>`; }
function bar(cur, max, cls){ return `<div class="bar ${cls||''}"><i style="width:${max?clamp(cur/max*100,0,100):0}%"></i></div>`; }

/* ---------- stamina (燈) ---------- */
const maxStam = () => 30 + (S.plv-1);
function tickStam(){
  const now = Date.now(), mx = maxStam();
  if (S.stam >= mx){ S.stamAt = now; return; }
  const n = Math.floor((now - S.stamAt)/REGEN_MS);
  if (n > 0){ S.stam = Math.min(mx, S.stam + n); S.stamAt += n*REGEN_MS; if (S.stam >= mx) S.stamAt = now; }
}
function stamTimerText(){
  if (S.stam >= maxStam()) return '燈は満ちている';
  const left = Math.max(0, REGEN_MS - (Date.now() - S.stamAt)), s = Math.ceil(left/1000);
  return `次の燈まで ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

/* ---------- story & lore ---------- */
const isNight = () => window.__night !== undefined ? window.__night : (h => h>=19 || h<5)(new Date().getHours());
const KN = ['','一','二','三','四','五','六','七','八','九'];
const kanjiNum = n => n<10 ? KN[n] : (n<20 ? '十' : KN[Math.floor(n/10)]+'十') + KN[n%10];
const loreNo = l => DATA.lore.indexOf(l) + 1;
const loreById = id => DATA.lore.find(l=>l.id===id);
const unreadLore = () => DATA.lore.filter(l=>S.lore[l.id]===1).length;
function grantLore(id){ if (!id || S.lore[id]) return null; S.lore[id] = 1; return loreById(id); }
function loreCandidates(ai, floor){
  return DATA.lore.filter(l => !S.lore[l.id] && l.src.area===ai && (l.src.floor||1) <= floor
    && (!l.src.night || isNight()) && (!l.src.afterClear || S.cleared[DATA.areas[ai].id]));
}
function pickLore(c){
  const w = c.map(l => l.src.rare ? 0.3 : 1), tot = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*tot; for (let i=0;i<c.length;i++){ r -= w[i]; if (r<=0) return c[i]; } return c[c.length-1];
}
function loreWhere(l){
  const s = l.src;
  if (s.inbox) return '鴉便';
  if (s.boss) return DATA.areas.find(a=>a.id===s.boss).name + 'の主を討つ';
  if (s.fam) return '図鑑で' + s.fam + '系統を揃える';
  const a = DATA.areas[s.area];
  return a.name + ((s.floor||1)>1 ? `・第${s.floor}層以深` : '') + (s.night ? '・夜のみ' : '') + (s.afterClear ? '・主を討った後' : '') + (s.rare ? '・稀' : '');
}
const FOUND_MSG = {'碑文':'苔むした石に、文字が刻まれている。', '手記':'朽ちた鞄の底に、綴じられた手記が残っていた。', '祈り':'崩れた祭壇に、祈りの文句が書きつけてある。',
  '手紙':'泥にまみれた封筒を拾った。', '書き置き':'壁の隙間に、折り畳まれた紙片が挟まっていた。'};
function markOwned(id){ S.owned[id] = true; S.seen[id] = true; }
function famMembers(f){ return Object.keys(DATA.monsters).filter(id=>DATA.monsters[id].fam===f); }
function checkFamilies(){
  const got = [];
  FAM_ORDER.forEach(f => {
    if (famMembers(f).every(id=>S.owned[id])){ const l = DATA.lore.find(x=>x.src.fam===f); const g = l && grantLore(l.id); if (g) got.push(g); }
  });
  if (got.length){ save(); const html = `<h4>碑文が揃った</h4><p>鎖に繋いだ魔たちの名が、碑文庫の石に並んだ。<br>石の裏に、新たな文字が浮かび上がる。</p>${got.map(l=>`<p class="gold">《${l.title}》を書き留めた。</p>`).join('')}<div class="mbtns"><button class="btn gold" data-act="rdlore" data-id="${got[0].id}" data-back="home">読む</button><button class="btn" data-act="close">閉じる</button></div>`;
    if ($('#modal').classList.contains('hide')) modal(html); else PENDING_MODAL = html; }
  return got;
}
function showStory(id, next){ S.story[id] = 1; READ = {kind:'story', id, next}; save(); go('reader'); }

/* ---------- UI helpers ---------- */
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg; $('#app').appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}
function modal(html){ const m=$('#modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.remove('hide'); }
function closeModal(){ $('#modal').classList.add('hide'); $('#modal').innerHTML='';
  if (PENDING_MODAL){ const h = PENDING_MODAL; PENDING_MODAL = null; modal(h); } }
function go(v){ VIEW = v; render(); }

function render(){
  const v = $('#view');
  const chrome = VIEW !== 'title', tabs = !['title','explore','battle','reader'].includes(VIEW);
  $('#topbar').classList.toggle('hide', !chrome);
  $('#tabbar').classList.toggle('hide', !tabs);
  v.classList.toggle('noscroll', VIEW==='explore' || VIEW==='battle');
  if (S) $('#gold').textContent = fmt(S.gold);
  const tabOf = {home:'home', archive:'home', party:'party', fusion:'party', guild:'guild', market:'market', menu:'menu'};
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tabOf[VIEW]));
  const fn = {title:vTitle, home:vHome, party:vParty, fusion:vFusion, guild:vGuild, market:vMarket, menu:vMenu, explore:vExplore, battle:vBattle, archive:vArchive, reader:vReader}[VIEW];
  v.innerHTML = fn();
  v.scrollTop = 0;
  if (VIEW==='explore' || VIEW==='battle'){ const lb = $('#log'); if (lb) lb.scrollTop = lb.scrollHeight; }
}

function rlog(t,c){ RUN.log.push({t,c}); if (RUN.log.length>80) RUN.log.splice(0, RUN.log.length-80); }
function doStep(){
  tickStam();
  if (S.stam < 1){ toast(`${DATA.stamina}が尽きた。時を待つか、燈油を使え。`); return; }
  const a = DATA.areas[RUN.ai];
  S.stam--; RUN.step++; RUN.lastLore = null;
  let lc;
  if (RUN.floor === a.floors && RUN.step >= a.steps){
    rlog('空気が凍りつく。最奥に、何かが蹲っている――', 'bad');
    startBattle([{id:a.boss.id, lv:a.boss.lv}], true); return;
  }
  const r = Math.random();
  if (r < 0.46){
    const n = rint(a.count[0], a.count[1]), foes = [];
    for (let i=0;i<n;i++) foes.push({id:pick(a.enemies), lv:clamp(a.lv[0] + rint(0, RUN.floor), a.lv[0], a.lv[1])});
    rlog('闇の奥で何かが蠢いた。――魔だ！', 'bad');
    startBattle(foes, false); return;
  } else if (r < 0.64){
    const g = rint(4,12) * (RUN.ai+1); S.gold += g; rlog(`朽ちた棺の中に、${g}枚の骨貨が残されていた。`, 'good');
  } else if (r < 0.71){
    S.items.kusuri++; rlog('倒れた旅人の懐に「凝血の薬」があった。……使わせてもらう。', 'good');
  } else if (r < 0.86 && (lc = loreCandidates(RUN.ai, RUN.floor)).length){
    const l = pickLore(lc); grantLore(l.id); RUN.lastLore = l.id;
    rlog(FOUND_MSG[l.type] + `――《${l.title}》を書き留めた。`, 'hl');
  } else if (r < 0.93){
    rlog(pick(a.flavor));
  } else if (r < 0.97){
    partyMons().forEach(m=>{ if (m.hp>0){ const c=calc(m); m.hp = Math.min(c.hp, m.hp + Math.ceil(c.hp*0.25)); m.mp = Math.min(c.mp, m.mp + Math.ceil(c.mp*0.2)); } });
    rlog('名も無き祠を見つけた。消えかけの灯りが、わずかに傷を癒した。', 'good');
  } else {
    rlog('何も起こらない。ただ灰だけが積もってゆく。', '');
  }
  checkDescend(); save(); render();
}
function checkDescend(){
  const a = DATA.areas[RUN.ai];
  if (RUN.step >= a.steps && RUN.floor < a.floors){ RUN.floor++; RUN.step = 0; rlog(`崩れた階段を見つけた。第${RUN.floor}層へ降りる。`, 'hl'); }
}

/* ---------- battle (auto) ---------- */
function mkUnit(side, id, lv, ref){
  const d = DATA.monsters[id], max = ref ? calc(ref) : calc({id, lv, plus:null});
  return {side, id, lv, ref, name:d.name, max, hp: ref?ref.hp:max.hp, mp: ref?ref.mp:max.mp, skills: ref?ref.skills.slice():d.skills.slice(), mods:{}, poison:0};
}
const eff = (u,k) => u.max[k] * (u.mods[k] ? u.mods[k].m : 1);
function dmgCalc(a, t, pow){
  const atk = eff(a,'atk')*pow, raw = atk - eff(t,'def')*0.4;
  return Math.max(1, Math.round(Math.max(raw, atk*0.12) * rand(0.85,1.15)));
}
function simulate(units){
  const ev = [];
  const snap = () => units.map(u=>[u.hp,u.mp]);
  const log = (t,c) => ev.push({t, c, s:snap()});
  const alive = side => units.filter(u=>u.side===side && u.hp>0);
  const nm = u => u.name;
  const hurt = (t, d) => { t.hp = Math.max(0, t.hp - d); };
  const died = t => { if (t.hp<=0) log(t.side==='p' ? `${nm(t)}は力尽きた……` : `${nm(t)}は崩れ落ち、灰に還った。`, t.side==='p'?'bad':'hl'); };
  const foesOf = u => alive(u.side==='p'?'e':'p'), friendsOf = u => alive(u.side);
  const fill = (s, a, t) => s.replace('{a}', nm(a)).replace('{t}', t?nm(t):'');
  function useSkill(u, key){
    const sk = DATA.skills[key]; u.mp -= sk.mp;
    const foes = foesOf(u), friends = friendsOf(u);
    if (sk.type==='heal'){
      const tg = sk.tgt==='allyAll' ? friends : [friends.slice().sort((x,y)=>x.hp/x.max.hp - y.hp/y.max.hp)[0]];
      log(fill(sk.msg, u, tg[0]), 'good');
      tg.forEach(t=>{ const h = Math.round((sk.pow + u.lv*3)*rand(.9,1.1)); const b=t.hp; t.hp = Math.min(t.max.hp, t.hp+h); log(`${nm(t)}の傷が ${t.hp-b} 癒えた。`, 'good'); });
      return;
    }
    if (sk.type==='buff'){ u.mods[sk.stat] = {m:1.5, n:3}; log(fill(sk.msg,u), 'hl'); log(`${nm(u)}の${STAT_JP[sk.stat]}が上がった。`); return; }
    const tg = sk.tgt==='all' ? foes : [pick(foes)];
    log(fill(sk.msg, u, tg[0]), u.side==='p'?'hl':'bad');
    tg.forEach(t=>{
      if (sk.type==='debuff'){ t.mods[sk.stat] = {m:0.7, n:3}; log(`${nm(t)}の${STAT_JP[sk.stat]}が下がった。`); return; }
      if (sk.type==='poison'){ if (!t.poison && Math.random()<0.8){ t.poison = 3; log(`${nm(t)}は毒に侵された！`); } else log(`${nm(t)}には効かなかった。`); return; }
      let d = sk.type==='magic' ? Math.round((sk.pow + eff(u,'atk')*0.45)*rand(.9,1.1)) : dmgCalc(u, t, sk.pow);
      hurt(t, d); log(`${nm(t)}に ${d} の傷！`, t.side==='p'?'bad':'');
      if (sk.type==='drain' && u.hp>0){ const h = Math.ceil(d/2); u.hp = Math.min(u.max.hp, u.hp+h); log(`${nm(u)}は ${h} の生気を得た。`, 'good'); }
      if (sk.poison && t.hp>0 && !t.poison && Math.random()<0.6){ t.poison = 3; log(`${nm(t)}は毒に侵された！`); }
      died(t);
    });
  }
  function act(u){
    const foes = foesOf(u), friends = friendsOf(u); if (!foes.length) return;
    const usable = u.skills.filter(k => DATA.skills[k].mp <= u.mp);
    const heals = usable.filter(k => DATA.skills[k].type==='heal');
    const low = friends.filter(f => f.hp < f.max.hp*0.45);
    if (heals.length && low.length){
      const all = heals.find(k=>DATA.skills[k].tgt==='allyAll');
      return useSkill(u, (all && low.length>=2) ? all : (heals.find(k=>DATA.skills[k].tgt==='ally') || heals[0]));
    }
    const offensive = usable.filter(k => { const s = DATA.skills[k];
      if (s.type==='heal') return false;
      if (s.type==='buff') return !u.mods[s.stat];
      if (s.type==='debuff') return foes.some(f=>!f.mods[s.stat]);
      if (s.type==='poison') return foes.some(f=>!f.poison);
      return true; });
    if (offensive.length && Math.random() < (u.side==='p'?0.45:0.4)) return useSkill(u, pick(offensive));
    const t = pick(foes); let d = dmgCalc(u, t, 1), crit = Math.random() < 0.06;
    if (crit) d = Math.round(d*1.6);
    hurt(t, d);
    log(`${crit?'会心！ ':''}${nm(u)}は${nm(t)}に襲いかかった。― ${d} の傷`, t.side==='p'?'bad':'');
    died(t);
  }
  const ens = units.filter(u=>u.side==='e');
  log(`── ${ens.length>1 ? ens[0].name+'たち' : ens[0].name}が現れた ──`, 'sep');
  let outcome = 'draw';
  outer: for (let round=1; round<=30; round++){
    const order = units.filter(u=>u.hp>0).map(u=>({u, k: eff(u,'spd')*rand(0.85,1.15)})).sort((a,b)=>b.k-a.k).map(o=>o.u);
    for (const u of order){
      if (u.hp<=0) continue;
      act(u);
      if (u.poison && u.hp>0){ const d = Math.max(1, Math.floor(u.max.hp*0.08)); hurt(u,d); u.poison--; log(`${nm(u)}は毒に蝕まれている。― ${d} の傷`, u.side==='p'?'bad':''); died(u); }
      if (!alive('e').length){ outcome='win'; break outer; }
      if (!alive('p').length){ outcome='lose'; break outer; }
    }
    units.forEach(u=>{ for (const k in u.mods){ if (--u.mods[k].n <= 0) delete u.mods[k]; } });
  }
  return {ev, outcome};
}
function startBattle(foes, boss){
  const pm = partyMons().filter(m=>m.hp>0);
  const units = pm.map(m=>mkUnit('p', m.id, m.lv, m));
  const counts = {};
  foes.forEach(f=>{ counts[f.id]=(counts[f.id]||0)+1; });
  const seen = {};
  foes.forEach(f=>{
    const u = mkUnit('e', f.id, f.lv, null);
    if (boss){ u.max.hp = Math.round(u.max.hp*(DATA.areas[RUN.ai].boss.hpx||1.5)); u.hp = u.max.hp; u.name = '【主】'+u.name; }
    const clash = pm.some(m=>m.id===f.id);
    if (counts[f.id] > 1 || clash){ seen[f.id]=(seen[f.id]||0); u.name += SUFFIX[seen[f.id]++] || ''; }
    units.push(u); S.seen[f.id] = true;
  });
  const sim = simulate(units);
  BT = {units, ev:sim.ev, outcome:sim.outcome, idx:0, done:false, boss, lines:[], after:[], recruit:null, ai:RUN.ai};
  // --- 結果の反映 ---
  units.filter(u=>u.side==='p').forEach(u=>{ u.ref.hp = u.hp; u.ref.mp = u.mp; });
  const res = BT.after;
  if (sim.outcome==='win'){
    const ens = units.filter(u=>u.side==='e');
    const xp = ens.reduce((t,u)=>t + Math.round(DATA.monsters[u.id].xp * u.lv * 1.5), 0);
    const gold = ens.reduce((t,u)=>t + rint(3,7)*u.lv, 0) + (boss?120*(RUN.ai+1):0);
    S.gold += gold;
    res.push({t:'── 勝利 ──', c:'sep'});
    res.push({t:`経験 +${xp}　骨貨 +${gold}`, c:'good'});
    units.filter(u=>u.side==='p' && u.hp>0).forEach(u=>gainExp(u.ref, xp, res));
    S.pexp += Math.ceil(xp/2);
    while (S.pexp >= S.plv*20){ S.pexp -= S.plv*20; S.plv++; S.stam = Math.min(maxStam(), S.stam+5); res.push({t:`檻守の位階が Lv${S.plv} に上がった。${DATA.stamina}の上限が増えた。`, c:'hl'}); }
    if (boss){
      const a = DATA.areas[RUN.ai]; S.cleared[a.id] = true;
      if (S.unlocked < DATA.areas.length && S.unlocked <= RUN.ai+1){ S.unlocked = RUN.ai+2; res.push({t:`${['壱','弐','参'][RUN.ai+1]}ノ門「${DATA.areas[RUN.ai+1].name}」の封印が解けた。`, c:'hl'}); S.selArea = RUN.ai+1; }
      res.push({t:`${a.name}を踏破した。`, c:'hl'});
      const bl = grantLore((DATA.areaStory[a.id]||{}).lore); if (bl) res.push({t:`主の骸の傍らに、古びた頁が落ちていた。――《${bl.title}》を書き留めた。`, c:'hl'});
    }
    // 仲間入り判定
    if (S.mons.length < BOX_MAX){
      const avg = units.filter(u=>u.side==='p').reduce((t,u)=>t+u.ref.lv,0) / Math.max(1, units.filter(u=>u.side==='p').length);
      for (const u of shuffle(ens)){
        const d = DATA.monsters[u.id]; if (d.fusionOnly) continue;
        const p = window.__forceRecruit ? 1 : clamp(d.rec*(boss?0.6:1) + (avg-u.lv)*0.03, 0.02, 0.7);
        if (Math.random() < p){ BT.recruit = {id:u.id, lv:u.lv}; break; }
      }
    }
  } else if (sim.outcome==='lose'){
    const lost = Math.floor(S.gold/2); S.gold -= lost;
    res.push({t:'── 敗北 ──', c:'sep'});
    res.push({t:`隊は倒れた。檻守は鎖を引き摺り、辛うじて拠点へ逃げ帰った……（骨貨 -${lost}）`, c:'bad'});
    partyMons().forEach(m=>{ if (m.hp<=0) m.hp = 1; });
  } else {
    res.push({t:'灰の霧が濃くなり、互いの姿を見失った。', c:'dim'});
  }
  save();
  VIEW = 'battle'; render();
  startPlayback();
}
function battleHTMLUnits(side){ return BT.units.map((u,i)=>u.side===side?unitHTML(u,i):'').join(''); }
function vBattle(){
  const a = DATA.areas[BT.ai];
  return `<div class="dhead"><span class="an">${BT.boss?'主との死闘':'遭遇'} ― ${a.name}</span><span class="fl">自動戦闘</span></div>
    <div class="prow" id="erow">${battleHTMLUnits('e')}</div>
    <div class="logbox" id="log"></div>
    <div class="prow" id="prow">${battleHTMLUnits('p')}</div>
    <div id="bctl" style="flex:none"></div>`;
}
function setUnitsFromSnap(s){
  s.forEach(([hp,mp],i)=>{
    const u = BT.units[i], el = document.getElementById('u'+i); if (!el) return;
    const prev = u._shp === undefined ? null : u._shp;
    if (prev !== null && hp < prev){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
    u._shp = hp;
    const bars = el.querySelectorAll('.bar i');
    bars[0].style.width = clamp(hp/u.max.hp*100,0,100)+'%';
    if (bars[1]) bars[1].style.width = clamp(mp/u.max.mp*100,0,100)+'%';
    el.querySelector('.hpn').textContent = `HP ${Math.max(0,hp)}/${u.max.hp}`;
    el.classList.toggle('dead', hp<=0);
  });
}
function pushBattleLine(e){
  const lb = $('#log'); if (!lb) return;
  lb.querySelectorAll('.new').forEach(n=>n.classList.remove('new'));
  const d = document.createElement('div'); d.className = (e.c||'') + ' new'; d.textContent = e.t; lb.appendChild(d);
  while (lb.children.length > 60) lb.removeChild(lb.firstChild);
  lb.scrollTop = lb.scrollHeight;
}
function startPlayback(){
  clearInterval(playTimer);
  // 開始時の HP 表示
  BT.units.forEach(u=>{ u._shp = undefined; });
  const init = BT.ev.length ? BT.ev[0].s : null; if (init) setUnitsFromSnap(init);
  $('#bctl').innerHTML = `<button class="btn wide" data-act="skip">早送り ▶▶</button>`;
  playTimer = setInterval(()=>{ if (!stepPlayback()) clearInterval(playTimer); }, window.__fastBattle ? 10 : 420);
}
function stepPlayback(){
  if (!BT || VIEW!=='battle') return false;
  if (BT.idx < BT.ev.length){ const e = BT.ev[BT.idx++]; pushBattleLine(e); setUnitsFromSnap(e.s); return true; }
  finishPlayback(); return false;
}
function skipPlayback(){
  clearInterval(playTimer);
  while (BT.idx < BT.ev.length){ const e = BT.ev[BT.idx++]; pushBattleLine(e); }
  if (BT.ev.length) setUnitsFromSnap(BT.ev[BT.ev.length-1].s);
  finishPlayback();
}
function finishPlayback(){
  if (BT.done) return; BT.done = true;
  BT.after.forEach(pushBattleLine);
  BT.units.forEach((u,i)=>{ if (u.side==='p'){ const el=document.querySelector('#u'+i+' .nm small'); if (el) el.textContent = `Lv${u.ref.lv} ${DATA.monsters[u.id].fam}`; } });
  renderBattleCtl();
}
function renderBattleCtl(){
  const c = $('#bctl'); if (!c) return;
  if (BT.recruit){
    const d = DATA.monsters[BT.recruit.id];
    c.innerHTML = `<div class="result"><div class="q">倒れたはずの<b class="gold">${d.name}</b>（Lv${BT.recruit.lv}）が軋みながら身を起こし、あなたの鎖の前に頭を垂れた。<br>――縛りますか？</div>
      <div class="row"><button class="btn gold" data-act="recruit" data-yes="1">鎖で縛る</button><button class="btn" data-act="recruit" data-yes="0">捨て置く</button></div></div>`;
    return;
  }
  const home = BT.boss || BT.outcome==='lose';
  c.innerHTML = `<button class="btn ${home?'red':'gold'} wide go" data-act="bdone">${home?'拠点へ戻る':'探索を続ける'}</button>`;
}
function doRecruit(yes){
  const r = BT.recruit, d = DATA.monsters[r.id]; BT.recruit = null;
  if (yes){
    const m = newMon(r.id, r.lv); S.mons.push(m); markOwned(r.id);
    let where = '檻の中';
    if (S.party.length < PARTY_MAX){ S.party.push(m.uid); where = '隊列'; }
    pushBattleLine({t:`${d.name}を鎖で縛った。（${where}へ）`, c:'hl'});
    BT.after.push({t:`${d.name}を鎖で縛った。`, c:'hl'});
  } else {
    pushBattleLine({t:`${d.name}は闇の奥へ這い去っていった。`});
  }
  save(); renderBattleCtl();
  if (yes) checkFamilies();
}
function battleDone(){
  clearInterval(playTimer);
  const b = BT; BT = null;
  if (b.boss || b.outcome==='lose'){
    RUN = null; save();
    const st = DATA.areaStory[DATA.areas[b.ai].id];
    if (b.outcome==='win' && st){ READ = null; return showStory(st.clear, 'homeClear:'+b.ai); }
    go('home');
    if (b.outcome==='win') modal(`<h4>踏破</h4><p>${DATA.areas[b.ai].name}の主は灰に還った。<br>鎖が微かに熱を帯びている。</p><div class="mbtns"><button class="btn gold" data-act="close">拠点に戻る</button></div>`);
    return;
  }
  b.after.forEach(l=>rlog(l.t, l.c));
  if (b.outcome==='win') rlog('戦いは終わった。静寂が戻る。', 'dim');
  checkDescend(); save(); go('explore');
}

/* ---------- fusion ---------- */
function fuseResult(A,B){
  const r = DATA.recipes.find(x => (x.a===A.id && x.b===B.id) || (x.a===B.id && x.b===A.id));
  if (r) return {id:r.out, special:true};
  const fa = MD(A).fam, fb = MD(B).fam;
  const key = [fa,fb].sort((x,y)=>FAM_ORDER.indexOf(x)-FAM_ORDER.indexOf(y)).join('');
  const fam = DATA.familyMix[key] || fa;
  const target = Math.min(4, Math.max(MD(A).rank, MD(B).rank) + 1);
  const cands = Object.entries(DATA.monsters).filter(([id,d]) => d.fam===fam && !d.fusionOnly);
  let best = cands.filter(([,d]) => d.rank <= target).sort((x,y)=>y[1].rank-x[1].rank);
  if (!best.length) best = cands.sort((x,y)=>x[1].rank-y[1].rank);
  const top = best.filter(([,d]) => d.rank === best[0][1].rank);
  const notParent = top.find(([id]) => id!==A.id && id!==B.id);
  return {id:(notParent||top[0])[0], special:false};
}
function inheritable(A,B,outId){
  const native = DATA.monsters[outId].skills;
  return [...new Set(A.skills.concat(B.skills))].filter(s => !native.includes(s));
}
function fuseBonus(A,B){
  const a = calc(A), b = calc(B), o = {};
  for (const k of ['hp','mp','atk','def','spd']) o[k] = Math.floor((a[k]+b[k])*0.06);
  return o;
}
function doFuse(){
  const A = getMon(FUSE.a), B = getMon(FUSE.b); if (!A || !B) return;
  const r = fuseResult(A,B), inh = inheritable(A,B,r.id), bonus = fuseBonus(A,B);
  const child = newMon(r.id, 1);
  child.plus = bonus;
  if (inh.length) child.skills.push(inh[FUSE.skill % inh.length]);
  const c = calc(child); child.hp = c.hp; child.mp = c.mp;
  const wasInParty = S.party.includes(A.uid) || S.party.includes(B.uid);
  S.mons = S.mons.filter(m => m.uid!==A.uid && m.uid!==B.uid);
  S.party = S.party.filter(u => u!==A.uid && u!==B.uid);
  S.mons.push(child); markOwned(r.id);
  if (S.party.length < PARTY_MAX && (wasInParty || !S.party.length)) S.party.push(child.uid);
  FUSE = {a:null, b:null, skill:0};
  save(); go('fusion');
  const d = DATA.monsters[r.id];
  modal(`<h4>配合の儀</h4><div style="display:flex;gap:10px;align-items:center">${sigil(d,'big')}<p>鎖が赤く灼け、二つの影が灰の中で溶け合う。<br>やがて――<b class="gold">${d.name}</b>が産声を上げた。</p></div>
    <div class="flavor">${d.flavor}</div><div class="small dim">特技：${child.skills.map(s=>DATA.skills[s].name).join('、')}</div>
    <div class="mbtns"><button class="btn gold" data-act="close">閉じる</button></div>`);
  checkFamilies();
}

/* ---------- actions ---------- */
const ACT = {
  newgame(){
    if (hasSave()) return modal(`<h4>はじめから</h4><p>既にある記録は失われる。<br>それでも鎖を握るか？</p><div class="mbtns"><button class="btn red" data-act="newgame2">はじめる</button><button class="btn" data-act="close">やめる</button></div>`);
    ACT.newgame2();
  },
  newgame2(){
    closeModal(); freshState(); save(); showStory('c0', 'homeIntro');
  },
  intro(){
    go('home');
    modal(`<h4>檻守の誓い</h4><p>錆びた鎖の先に、二匹の魔が繋がれている。<br>痩せた野犬<b class="gold">煤牙</b>と、青白く揺れる<b class="gold">泣き燭</b>。</p><p class="dim small">冥門を選び「探索」で進め。倒した魔は時に鎖を受け入れる。</p><div class="mbtns"><button class="btn gold" data-act="close">鎖を握る</button></div>`);
  },
  continue(){ if (load()){ tickStam(); go('home'); toast('記録を読み込んだ。'); } else toast('記録が見つからない。'); },
  tab(b){ if (!S) return; closeModal(); if (b.tab==='party') FUSE = {a:null,b:null,skill:0}; go(b.tab); },
  close(){ closeModal(); },
  save(){ tickStam(); if (save()) toast('記録を刻んだ。'); else toast('記録に失敗した。'); },
  rest(){
    partyMons().concat(boxMons()).forEach(m=>{ const c=calc(m); m.hp=c.hp; m.mp=c.mp; });
    save(); render(); toast('焚き火の傍で魔たちは傷を舐め合った。（全快）');
  },
  gate(b){ S.selArea = +b.i; save(); render(); },
  explore(){ startExplore(); },
  step(){ doStep(); },
  kusuri(){
    if (!S.items.kusuri) return; S.items.kusuri--;
    partyMons().forEach(m=>{ if (m.hp>0){ const c=calc(m); m.hp=Math.min(c.hp, m.hp+Math.ceil(c.hp*0.5)); } });
    rlog('凝血の薬を分け与えた。鉄錆の味が、魔たちの傷を塞ぐ。', 'good'); save(); render();
  },
  leave(){ rlog('帰還した。'); RUN = null; save(); go('home'); toast('拠点へ帰還した。'); },
  skip(){ skipPlayback(); },
  recruit(b){ doRecruit(b.yes==='1'); },
  bdone(){ battleDone(); },
  mon(b){ showMon(+b.uid); },
  swapto(b){
    const i = S.party.indexOf(+b.with); if (i<0) return;
    S.party[i] = +b.uid; save(); closeModal(); render(); toast('隊列を入れ替えた。');
  },
  addparty(b){ if (S.party.length<PARTY_MAX){ S.party.push(+b.uid); save(); closeModal(); render(); } },
  swapmenu(b){
    const m = getMon(+b.uid);
    modal(`<h4>誰と入れ替える？</h4><div class="mlist">${partyMons().map(p=>mcard(p).replace('data-act="mon"', `data-act="swapto" data-with="${p.uid}" data-uid="${m.uid}"`).replace(`data-uid="${p.uid}"`, '')).join('')}</div>
      <div class="mbtns"><button class="btn" data-act="close">やめる</button></div>`);
  },
  unparty(b){ if (S.party.length<=1) return toast('隊を空にはできない。'); S.party = S.party.filter(u=>u!==+b.uid); save(); closeModal(); render(); },
  release(b){
    const m = getMon(+b.uid);
    modal(`<h4>放逐</h4><p><b class="gold">${MD(m).name}</b>（Lv${m.lv}）の鎖を解き、闇へ還すか？<br><span class="dim small">二度と戻らない。</span></p>
      <div class="mbtns"><button class="btn red" data-act="release2" data-uid="${m.uid}">鎖を解く</button><button class="btn" data-act="close">やめる</button></div>`);
  },
  release2(b){
    const uid = +b.uid, m = getMon(uid); if (!m) return;
    S.mons = S.mons.filter(x=>x.uid!==uid); S.party = S.party.filter(x=>x!==uid);
    save(); closeModal(); render(); toast(`${MD(m).name}は闇の奥へ消えていった。`);
  },
  fusion(){ FUSE = {a:null,b:null,skill:0}; go('fusion'); },
  fpick(b){
    const uid = +b.uid;
    if (FUSE.a===uid) FUSE.a = null; else if (FUSE.b===uid) FUSE.b = null;
    else if (!FUSE.a) FUSE.a = uid; else if (!FUSE.b) FUSE.b = uid; else FUSE.b = uid;
    FUSE.skill = 0; render();
  },
  fskill(){ FUSE.skill++; render(); },
  fuse(){
    const A = getMon(FUSE.a), B = getMon(FUSE.b), d = DATA.monsters[fuseResult(A,B).id];
    modal(`<h4>配合の儀</h4><p><b class="gold">${MD(A).name}</b>と<b class="gold">${MD(B).name}</b>を失い、<b class="red">${d.name}</b>を産む。<br>よろしいか？</p>
      <div class="mbtns"><button class="btn red" data-act="fuse2">儀を執り行う</button><button class="btn" data-act="close">やめる</button></div>`);
  },
  fuse2(){ closeModal(); doFuse(); },
  buy(b){
    const it = DATA.items[b.k]; if (S.gold < it.price) return;
    S.gold -= it.price; S.items[b.k] = (S.items[b.k]||0)+1; save(); render(); toast(`${it.name}を手に入れた。`);
  },
  usetouyu(){
    if (!S.items.touyu) return; tickStam(); S.items.touyu--; S.stam = Math.min(maxStam(), S.stam+10); save(); render(); toast(`${DATA.stamina}が燃え上がった。（+10）`);
  },
  fac(b){
    const f = b.f;
    if (f==='tavern') modal(`<h4>澱の酒場</h4><p class="dim small">煤けた梁の下、酔いどれの檻守が杯を傾けている。</p><p>${pick(DATA.npc.rumors)}</p><div class="mbtns"><button class="btn" data-act="fac" data-f="tavern">別の話を聞く</button><button class="btn" data-act="close">店を出る</button></div>`);
    if (f==='archive'){ ARCH = unreadLore() ? 'lore' : 'zukan'; go('archive'); }
    if (f==='daily'){
      if (S.daily !== today()){ S.daily = today(); tickStam(); S.gold += 80; S.stam = Math.min(maxStam(), S.stam+10); save(); render();
        modal(`<h4>日々の贖い</h4><p>名も無き墓に灰を払い、祈りを捧げた。<br>どこからか、骨貨が転がり落ちてきた。</p><p class="gold">骨貨 +80 ・ ${DATA.stamina} +10</p><div class="mbtns"><button class="btn" data-act="close">閉じる</button></div>`);
      } else modal(`<h4>日々の贖い</h4><p class="dim">今日の贖いは既に済んだ。<br>また陽の無い朝に来るがいい。</p><div class="mbtns"><button class="btn" data-act="close">閉じる</button></div>`);
    }
    if (f==='inbox'){
      const first = !S.letter;
      if (first){ S.letter = true; S.items.kusuri += 3; grantLore('l01'); save(); render(); }
      modal(`<h4>鴉便</h4><p style="white-space:pre-line">${DATA.npc.letter}</p>${first?'<p class="gold">凝血の薬 ×3 を受け取った。</p><p class="dim small">手紙は碑文庫の「読み物」に綴じておいた。</p>':'<p class="faint small">（既読）</p>'}<div class="mbtns"><button class="btn" data-act="close">閉じる</button></div>`);
    }
  },
  arch(b){ ARCH = b.t; render(); },
  zk(b){ zukanDetail(b.id); },
  rdstory(b){ READ = {kind:'story', id:b.id, next:'archive'}; go('reader'); },
  rdlore(b){ closeModal(); READ = {kind:'lore', id:b.id, back:b.back||'archive'}; go('reader'); },
  rdnext(){
    const n = READ.next || READ.back || 'archive'; READ = null;
    if (n==='homeIntro') return ACT.intro();
    if (n.startsWith('homeClear')){ const ai = +n.split(':')[1]; go('home');
      return modal(`<h4>踏破</h4><p>${DATA.areas[ai].name}の主は灰に還った。<br>鎖が微かに熱を帯びている。</p><p class="dim small">この章は碑文庫の「物語」から読み返せる。</p><div class="mbtns"><button class="btn gold" data-act="close">拠点に戻る</button></div>`); }
    if (n==='archive'){ ARCH = READ_prevTab(); }
    go(n);
  },
  howto(){
    modal(`<h4>遊び方</h4><p class="small">・拠点で<b>冥門</b>を選び<b>探索</b>。「進む」ごとに${DATA.stamina}を1消費し、何かが起こる。<br>・魔に遭うと<b>自動戦闘</b>。勝てば経験と骨貨、時に魔が仲間になる。<br>・最奥の<b>主</b>を倒すと次の門が開く。<br>・${DATA.stamina}は時と共に回復する（${REGEN_MS/1000}秒で1）。<br>・<b>支度</b>で隊の入れ替え、休息、<b>配合</b>（Lv${DATA.fuseMinLv}以上の二体から新たな魔を産む）。<br>・記録は自動でも行われるが、「記録」で明示的に刻める。</p><div class="mbtns"><button class="btn" data-act="close">閉じる</button></div>`);
  },
  totitle(){ save(); RUN=null; BT=null; go('title'); },
  wipe(){ modal(`<h4>記録を消す</h4><p>全ての記録が灰になる。よろしいか？</p><div class="mbtns"><button class="btn red" data-act="wipe2">消す</button><button class="btn" data-act="close">やめる</button></div>`); },
  wipe2(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} S=null; closeModal(); go('title'); }
};
function READ_prevTab(){ return ARCH; }
function zukanDetail(id){
  const d = DATA.monsters[id], seen = S.seen[id], own = S.owned[id];
  if (!seen) return;
  modal(`<div style="display:flex;gap:10px;align-items:center">${sigil(d,'big')}<div><div style="font-size:18px">${d.name}<span class="fam">${d.fam}系</span></div>
    <div class="small dim">格${'★'.repeat(d.rank)} ・ ${own?'鎖に繋いだことがある':'見かけただけ'}</div></div></div>
    <div class="flavor">${d.flavor}</div>
    ${own ? `<div class="stats"><div><span>HP</span><span>${d.base.hp}</span></div><div><span>MP</span><span>${d.base.mp}</span></div><div><span>攻撃</span><span>${d.base.atk}</span></div><div><span>守備</span><span>${d.base.def}</span></div><div><span>素早さ</span><span>${d.base.spd}</span></div><div><span></span><span class="faint small">（Lv1の値）</span></div></div>
      ${d.skills.map(k=>`<div class="skl"><b>${DATA.skills[k].name}</b> <span>${DATA.skills[k].desc}</span></div>`).join('')}
      ${d.lore?`<div class="addendum"><div class="ah">― 碑の追記 ―</div>${d.lore}</div>`:''}`
      : `<p class="faint small">この魔を鎖で縛れば、碑に追記が刻まれる。</p>`}
    <div class="mbtns"><button class="btn" data-act="close">閉じる</button></div>`);
}
function showMon(uid){
  const m = getMon(uid); if (!m) return;
  const inParty = S.party.includes(uid);
  const btns = [];
  if (inParty) btns.push(`<button class="btn" data-act="unparty" data-uid="${uid}" ${S.party.length<=1?'disabled':''}>隊から外す</button>`);
  else if (S.party.length < PARTY_MAX) btns.push(`<button class="btn gold" data-act="addparty" data-uid="${uid}">隊に加える</button>`);
  else btns.push(`<button class="btn gold" data-act="swapmenu" data-uid="${uid}">隊の誰かと入れ替える</button>`);
  btns.push(`<button class="btn red" data-act="release" data-uid="${uid}" ${S.mons.length<=1||(inParty&&S.party.length<=1)?'disabled':''}>放つ</button>`);
  btns.push(`<button class="btn" data-act="close">閉じる</button>`);
  modal(monDetail(m) + `<div class="mbtns">${btns.join('')}</div>`);
}

document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b.dataset);
});
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
setInterval(()=>{
  if (!S) return; tickStam();
  if (VIEW==='home'){
    const t = $('#stamtimer'), n = $('#stamnum'), b = $('#stambar i');
    if (t) t.textContent = stamTimerText(); if (n) n.textContent = `${S.stam}/${maxStam()}`; if (b) b.style.width = (S.stam/maxStam()*100)+'%';
  }
}, 1000);

// テスト・デバッグ用フック
window.__game = { get S(){ return S; }, get VIEW(){ return VIEW; }, get RUN(){ return RUN; }, get BT(){ return BT; }, get READ(){ return READ; }, render, save, calc, newMon, go, simulate, mkUnit, checkFamilies, grantLore, loreCandidates };
render();
})();
